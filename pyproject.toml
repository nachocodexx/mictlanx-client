[tool.poetry]
name = "mictlanx"
version = "0.1.1a0"
description = "MictlanX Client - safely store your data and access them from any application"
authors = ["Ignacio Castillo <ignacio.bcastillo@gmail.com>"]
license = "GPL-3.0-only"
readme = "README.md"
packages = [{ include = "mictlanx" }]

[tool.poetry.dependencies]
python = ">=3.10,<4"
ipaddress = "^1.0.23"
nanoid = "^2.0.0"
option = "^2.1.0"
requests = "^2.31.0"
retry = "^0.9.2"
humanfriendly = "^10.0"
httpx = {extras = ["http2"], version = "^0.28.1"}
numpy = ">=1.21.0"
pyparsing = "^3.1.2"
lz4 = {version = "^4.4.3", optional = true}
tqdm = {version = "^4.67.1", optional = true}
cryptography = {version = "^43.0.0", optional = true}
pydantic = "^2.10.6"
xolo = ">=0.0.8a13"
rich = "^15.0.0"

[tool.poetry.extras]
compression = ["lz4"]
rich        = ["rich"]
tqdm        = ["tqdm"]
progress    = ["rich", "tqdm"]
crypto      = ["cryptography"]

[tool.poetry.group.dev.dependencies]
pytest = "*"
pandas = "*"
scipy = "*"
python-dotenv = "^1.0.1"
pytest-asyncio = "^0.25.3"
ipykernel = "^6.29.5"
seaborn = "^0.13.2"
coverage = "^7.10.4"
respx = "^0.22.0"
mkdocstrings-python = "^2.0.3"
zensical = "^0.0.24"


[tool.poetry.group.apac.dependencies]
boto3 = "^1.43.2"
dropbox = "^12.0.2"
google-api-python-client = "^2.195.0"
google-auth-httplib2 = "^0.3.1"
google-auth-oauthlib = "^1.3.1"

[[tool.poetry.source]]
name = "test"
url = "https://test.pypi.org/simple/"
priority = "supplemental"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "strict"
addopts = "--ignore=tests/test_apac_storage.py --ignore=tests/test_apac_strategies.py"
